on:
  release:
    types:
      - published
  # Re-run a publish that failed (each package skips versions already on npm/JSR).
  workflow_dispatch:

name: publish

jobs:
  publish:
    if: ${{ github.ref_type != 'tag' || startsWith(github.ref_name, 'tiny-packages') }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Ensure npm >= 11.5.1 for OIDC
        # Pinned to a major that supports this Node; npm@latest can drop support for it.
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: bun install
      - name: Publish all packages to NPM
        run: ./scripts/publish-all-npm.sh
        env:
          NODE_AUTH_TOKEN: ''
      - name: Clean up after npm style
        run: ./scripts/clean-all-npm.sh
      - name: Publish all packages to JSR
        run: ./scripts/publish-all-jsr.sh
